name: 'CodeQL'
# Must be called codeql.yml NOT codeql.yaml or GitHub will ignore it

'on':
  workflow_dispatch:
  push:
    branches: ['main', 'master']
    paths:
      - '!.github/**'
      - '!.docs/**'
  schedule:
    - cron: '40 4 * * 0'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions: {}

jobs:
  codeql:
    name: 'CodeQL'
    permissions:
      contents: read  # checkout
      security-events: write  # upload results to code scanning
      packages: read  # fetch internal or private CodeQL packs
      actions: read  # the upload reads run info on private repositories
    # yamllint disable-line rule:line-length
    uses: lfreleng-actions/security-workflows/.github/workflows/codeql.yaml@ef6c0d9930feedb274067703b50eeebe5ab859b3  # v0.9.5
    with:
      languages: 'python,actions,c-cpp'
